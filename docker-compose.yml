services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: dosya_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sigma}
      - POSTGRES_USER=${POSTGRES_USER:-sigma}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sigma}
    ports:
      - "5433:5432"  # 5433 kullan (dış port)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dosya_network

  redis:
    image: redis:7-alpine
    container_name: dosya_redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"  # 6380 kullan (dış port)
    volumes:
      - redis_data:/data
    networks:
      - dosya_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dosya_backend
    env_file:
      - .env
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./backend/models:/app/backend/models  # Trained models persist
    depends_on:
      - postgres
      - redis
    networks:
      - dosya_network
    ports:
      - "8001:8000"  # 8001 kullan (dış port)
    # GPU support (requires nvidia-docker2)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dosya_celery_worker
    env_file:
      - .env
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      - redis
      - backend
    networks:
      - dosya_network
    command: >
      celery -A backend.tasks.celery_app:celery_app worker -E --loglevel=info -Q celery,analysis,market,default

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dosya_celery_beat
    env_file:
      - .env
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      - redis
      - backend
    networks:
      - dosya_network
    command: >
      celery -A backend.tasks.celery_app:celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dosya_flower
    env_file:
      - .env
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      - redis
      - backend
      - celery_worker
    networks:
      - dosya_network
    ports:
      - "5556:5555"  # 5556 kullan (dış port, Flower için)
    command: celery -A backend.tasks.celery_app:celery_app flower --port=5555

networks:
  dosya_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
